[package]
name = "awvm-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tools for the Another World VM toolchain (Rust port)."

[[bin]]
name = "banks2resources"
path = "src/bin/banks2resources.rs"

[[bin]]
name = "awvm-disasm"
path = "src/bin/awvm-disasm.rs"

[[bin]]
name = "awvm-asm"
path = "src/bin/awvm-asm.rs"

[[bin]]
name = "adf-extract"
path = "src/bin/adf-extract.rs"

[[bin]]
name = "valve-pak-extract"
path = "src/bin/valve-pak-extract.rs"

[[bin]]
name = "opera-list"
path = "src/bin/opera-list.rs"

[dependencies]
awvm = { path = "../awvm" }
exectrace = { path = "../exectrace" }

# symbian_demo's romset prep needs zlib (outer) + LZMA1 (inner) decompression.
flate2 = "1.0"
lzma-rs = "0.3"
